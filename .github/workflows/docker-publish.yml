name: Docker Image CI/CD (Optimization Engine)

on:
  push:
    branches: [ "deploy" ]
    paths:
      - 'backend/**'
      - 'engine/**'
      - 'python_rl_service/**'
      - 'Dockerfile.node'
      - 'python_rl_service/Dockerfile'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ "deploy" ]

jobs:
  build-and-push-node:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Optimization Node Backend
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.node
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ secrets.DOCKER_USERNAME }}/optimization-node-backend:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/optimization-node-backend:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/optimization-node-backend:buildcache,mode=max

  build-and-push-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Optimization Python RL Backend
      uses: docker/build-push-action@v5
      with:
        context: ./python_rl_service
        file: ./python_rl_service/Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ secrets.DOCKER_USERNAME }}/optimization-python-rl:latest
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/optimization-python-rl:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/optimization-python-rl:buildcache,mode=max
